  <text x="210" y="145" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">HỢP TÁC QUỐC TẾ</text>
  <text x="100" y="240" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#ffffff">Tăng Cường Hợp Tác Quốc Tế</text>
  <text x="100" y="295" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#fb7185">&amp; Ngoại Giao Đa Phương Chủ Động</text>
  <text x="100" y="360" font-family="system-ui, sans-serif" font-size="20" fill="#fecdd3">Khẳng định vị thế toàn cầu, mở rộng quan hệ đối tác chiến lược.</text>
