<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f0e17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="950" cy="315" r="180" fill="none" stroke="#eab308" stroke-width="4" opacity="0.4"/>
  <text x="950" y="340" font-family="system-ui, sans-serif" font-size="120" font-weight="bold" fill="#eab308" text-anchor="middle" opacity="0.3">$</text>
  <rect x="100" y="120" width="220" height="40" rx="8" fill="url(#accent)"/>
  <text x="210" y="145" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e1b4b" text-anchor="middle">TÀI CHÍNH TOÀN CẦU</text>
  <text x="100" y="240" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#ffffff">Thị Trường Tài Chính Toàn Cầu</text>
  <text x="100" y="295" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#facc15">&amp; Xu Hướng Lãi Suất Mới</text>
  <text x="100" y="360" font-family="system-ui, sans-serif" font-size="20" fill="#fef08a">Phân tích lạm phát, tỷ giá và phản ứng của ngân hàng trung ương.</text>
</svg>
