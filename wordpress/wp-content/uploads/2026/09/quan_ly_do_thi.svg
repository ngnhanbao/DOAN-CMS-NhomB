<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311b92"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g fill="#22d3ee" opacity="0.15">
    <rect x="750" y="250" width="70" height="280"/>
    <rect x="840" y="180" width="90" height="350"/>
    <rect x="950" y="300" width="60" height="230"/>
    <rect x="1030" y="200" width="100" height="330"/>
  </g>
  <rect x="100" y="120" width="220" height="40" rx="8" fill="url(#accent)"/>
  <text x="210" y="145" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">ĐÔ THỊ &amp; GIAO THÔNG</text>
  <text x="100" y="240" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#ffffff">Đổi Mới Công Tác Quản Lý Đô Thị</text>
  <text x="100" y="295" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#22d3ee">&amp; Hạ Tầng Giao Thông Hiện Đại</text>
  <text x="100" y="360" font-family="system-ui, sans-serif" font-size="20" fill="#c7d2fe">Quy hoạch đô thị thông minh, phát triển giao thông công cộng xanh.</text>
</svg>
